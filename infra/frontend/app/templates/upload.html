<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Subir documento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .upload-card {
      width: 100%;
      max-width: 600px;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.1);
      background-color: #fff;
    }
  </style>
</head>
<body>
  <div class="upload-card">
    <h2 class="text-center mb-4">Subir CSV</h2>
    <form method="post" action="/upload" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="file" class="form-label">Selecciona archivo CSV</label>
        <input class="form-control" type="file" id="file" name="file" accept=".csv" required>
      </div>
      <div class="mb-3">
        <label for="param_a" class="form-label">Param A</label>
        <input class="form-control" id="param_a" name="param_a" required>
      </div>
      <div class="mb-3">
        <label for="param_b" class="form-label">Param B</label>
        <input class="form-control" id="param_b" name="param_b" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Subir</button>
      </div>
    </form>

    <h3 class="mt-5">Documentos subidos</h3>
    <ul class="list-group">
      {% for f in files %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <span>{{ f.file_name }} — {{ f.uploaded_at }}</span>
          <form method="post" action="/delete" class="m-0">
            <input type="hidden" name="filename" value="{{ f.file_name }}">
            <button type="submit" class="btn btn-sm btn-danger">Borrar</button>
          </form>
        </li>
      {% endfor %}
    </ul>
  </div>
</body>
</html>
